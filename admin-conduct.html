<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conduct Management | Three Rivers Academy</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 25px 15px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 35px;
            padding-left: 12px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            text-decoration: none;
            color: #4b5563;
            padding: 13px 15px;
            border-radius: 10px;
        }

        .nav a:hover {
            background: #f3f4f6;
        }

        .nav a.active {
            background: #eef2ff;
            color: #4f46e5;
            font-weight: 600;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 35px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        /* FORM */

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 30px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .button-row {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .primary {
            background: #4f46e5;
            color: white;
        }

        .primary:hover {
            background: #4338ca;
        }

        .secondary {
            background: #f3f4f6;
            color: #374151;
        }

        /* RECORDS */

        .records {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 28px;
        }

        .records h2 {
            margin-bottom: 20px;
        }

        .record {
            border-bottom: 1px solid #edf0f4;
            padding: 18px 0;
        }

        .record:last-child {
            border-bottom: none;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-title {
            font-weight: 700;
        }

        .positive {
            color: #15803d;
        }

        .negative {
            color: #dc2626;
        }

        .record-info {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .record-points {
            font-weight: 700;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #ecfdf5;
            color: #166534;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                width: calc(100% - 210px);
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }

    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Three Rivers Academy
        </div>

        <nav class="nav">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="timetable.html">
                Timetable
            </a>

            <a href="assignments.html">
                Assignments
            </a>

            <a href="grades.html">
                Grades
            </a>

            <a href="attendance.html">
                Attendance
            </a>

            <a href="conduct.html">
                Conduct
            </a>

            <a href="admin-conduct.html" class="active">
                Manage Conduct
            </a>

            <a href="announcements.html">
                Announcements
            </a>

            <a href="profile.html">
                Profile
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="header">

            <h1>Conduct Management</h1>

            <p>
                Add and manage positive and negative conduct records.
            </p>

        </div>


        <!-- ADD CONDUCT -->

        <section class="card">

            <h2>
                Add Conduct Record
            </h2>

            <div class="form-grid">

                <div class="field">

                    <label for="studentSelect">
                        Student
                    </label>

                    <select id="studentSelect">

                        <option value="">
                            Loading students...
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="conductType">
                        Conduct Type
                    </label>

                    <select id="conductType">

                        <option value="positive">
                            Positive
                        </option>

                        <option value="negative">
                            Negative
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="conductTitle">
                        Conduct / Behaviour
                    </label>

                    <input
                        type="text"
                        id="conductTitle"
                        placeholder="e.g. Helped another student"
                    >

                </div>


                <div class="field">

                    <label for="conductPoints">
                        Points
                    </label>

                    <input
                        type="number"
                        id="conductPoints"
                        min="1"
                        placeholder="e.g. 5"
                    >

                </div>


                <div class="field full">

                    <label for="conductDescription">
                        Description / Comment
                    </label>

                    <textarea
                        id="conductDescription"
                        placeholder="Explain what happened..."
                    ></textarea>

                </div>

            </div>


            <div class="button-row">

                <button
                    class="primary"
                    onclick="addConductRecord()"
                >
                    Add Conduct Record
                </button>

                <button
                    class="secondary"
                    onclick="clearForm()"
                >
                    Clear
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>

        </section>


        <!-- RECORDS -->

        <section class="records">

            <h2>
                Recent Conduct Records
            </h2>

            <div id="recordsContainer">

                Loading records...

            </div>

        </section>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://deurewdqzvlioopuhikx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_k2TUtDnGrc0Bupc7kmYEOQ__-vaiMig";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   LOAD STUDENTS
========================================== */

async function loadStudents() {

    const select =
        document.getElementById(
            "studentSelect"
        );


    const {
        data: students,
        error
    } = await supabaseClient
        .from("students")
        .select("id, name")
        .order("name");


    if (error) {

        console.error(
            "Student loading error:",
            error
        );

        select.innerHTML =
            `<option value="">
                Could not load students
            </option>`;

        return;
    }


    select.innerHTML =
        `<option value="">
            Select a student
        </option>`;


    students.forEach(student => {

        const option =
            document.createElement("option");

        option.value =
            student.id;

        option.textContent =
            student.name;

        select.appendChild(option);

    });

}


/* ==========================================
   ADD CONDUCT RECORD
========================================== */

async function addConductRecord() {

    const studentId =
        document.getElementById(
            "studentSelect"
        ).value;


    const type =
        document.getElementById(
            "conductType"
        ).value;


    const title =
        document.getElementById(
            "conductTitle"
        ).value.trim();


    const points =
        Number(
            document.getElementById(
                "conductPoints"
            ).value
        );


    const description =
        document.getElementById(
            "conductDescription"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    if (
        !studentId ||
        !title ||
        !points
    ) {

        showMessage(
            "Please select a student, enter a conduct behaviour and enter points.",
            "error"
        );

        return;
    }


    const {
        error
    } = await supabaseClient
        .from("conduct_records")
        .insert({

            student_id: studentId,

            type: type,

            title: title,

            description: description,

            points: points

        });


    if (error) {

        console.error(
            "Conduct insert error:",
            error
        );

        showMessage(
            "Could not add the conduct record.",
            "error"
        );

        return;
    }


    showMessage(
        "Conduct record added successfully.",
        "success"
    );


    clearForm();


    loadRecords();

}


/* ==========================================
   LOAD RECENT RECORDS
========================================== */

async function loadRecords() {

    const container =
        document.getElementById(
            "recordsContainer"
        );


    const {
        data: records,
        error
    } = await supabaseClient
        .from("conduct_records")
        .select(`
            *,
            students (
                name
            )
        `)
        .order("created_at", {
            ascending: false
        })
        .limit(30);


    if (error) {

        console.error(
            "Records loading error:",
            error
        );

        container.innerHTML =
            "Could not load conduct records.";

        return;
    }


    if (!records.length) {

        container.innerHTML =
            "No conduct records yet.";

        return;
    }


    container.innerHTML =
        records.map(record => {

            const isPositive =
                record.type === "positive";


            return `

                <div class="record">

                    <div class="record-header">

                        <div>

                            <div class="record-title
                                ${isPositive
                                    ? "positive"
                                    : "negative"}">

                                ${record.title}

                            </div>

                            <div class="record-info">

                                Student:
                                ${record.students?.name || "Unknown"}

                            </div>

                        </div>


                        <div class="record-points
                            ${isPositive
                                ? "positive"
                                : "negative"}">

                            ${isPositive ? "+" : "-"}
                            ${record.points}

                        </div>

                    </div>


                    <div class="record-info">

                        ${record.description || ""}

                    </div>

                </div>

            `;

        }).join("");

}


/* ==========================================
   CLEAR FORM
========================================== */

function clearForm() {

    document.getElementById(
        "studentSelect"
    ).value = "";


    document.getElementById(
        "conductType"
    ).value = "positive";


    document.getElementById(
        "conductTitle"
    ).value = "";


    document.getElementById(
        "conductPoints"
    ).value = "";


    document.getElementById(
        "conductDescription"
    ).value = "";

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    setTimeout(() => {

        message.style.display =
            "none";

    }, 4000);

}


/* ==========================================
   START
========================================== */

loadStudents();

loadRecords();

</script>

</body>
</html>
