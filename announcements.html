<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Announcements | Student Management Portal
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >
</head>


<body>

    <div class="dashboard-layout">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <h2>
                    Student Portal
                </h2>

                <span>
                    Student Management
                </span>

            </div>


            <nav class="sidebar-nav">

                <a href="student-dashboard.html">
                    Dashboard
                </a>

                <a href="timetable.html">
                    Timetable
                </a>

                <a href="assignments.html">
                    Assignments
                </a>

                <a href="grades.html">
                    Grades
                </a>

                <a href="attendance.html">
                    ✅ Attendance
                </a>

                <a
                    href="announcements.html"
                    class="active"
                >
                    Announcements
                </a>

                <a href="profile.html">
                    My Profile
                </a>

            </nav>


            <div class="sidebar-bottom">

                <button
                    id="logoutButton"
                    type="button"
                >
                    Sign out
                </button>

            </div>

        </aside>



        <!-- MAIN CONTENT -->

        <main class="main-content">


            <!-- TOPBAR -->

            <header class="topbar">

                <div>

                    <p class="school-name">
                        Student Management Portal
                    </p>

                    <h1>
                        Announcements
                    </h1>

                </div>


                <div class="student-profile">

                    <div class="profile-avatar">

                        <span id="announcementsInitial">
                            -
                        </span>

                    </div>


                    <div class="profile-details">

                        <strong
                            id="announcementsStudentName"
                        >
                            Loading...
                        </strong>

                        <small>
                            Student
                        </small>

                    </div>

                </div>

            </header>



            <!-- ANNOUNCEMENTS -->

            <section class="dashboard-card">

                <div class="card-header">

                    <div>

                        <h3>
                            School Announcements
                        </h3>

                        <p>
                            Important information from your school
                        </p>

                    </div>

                </div>


                <div
                    id="announcementsPageContainer"
                    class="announcements-page-container"
                >

                    <p class="loading-message">
                        Loading announcements...
                    </p>

                </div>

            </section>


        </main>

    </div>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- MAIN JS -->

    <script src="js/main.js"></script>

</body>

</html>
