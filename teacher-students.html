<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Students | Student Management Portal</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <style>

        .teacher-students-page {
            padding: 30px;
        }

        .teacher-students-header {
            margin-bottom: 25px;
        }

        .teacher-students-header h1 {
            margin-bottom: 8px;
        }

        .teacher-students-header p {
            color: #666;
        }

        .student-search-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .student-search-box input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .student-search-box input:focus {
            border-color: #16a34a;
        }

        .students-table-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
        }

        .students-table th,
        .students-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .students-table th {
            background: #f8fafc;
            font-weight: 600;
        }

        .students-table tr:hover {
            background: #f8fffa;
        }

        .student-name {
            font-weight: 600;
        }

        .student-admission {
            color: #666;
        }

        .student-class {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 700px) {

            .teacher-students-page {
                padding: 20px;
            }

            .students-table th,
            .students-table td {
                padding: 10px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body>

    <div class="dashboard-layout">


        <!-- ==============================
             SIDEBAR
        =============================== -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <h2>
                    Student Portal
                </h2>

                <p>
                    Teacher Portal
                </p>

            </div>


            <nav class="sidebar-nav">

                <a href="teacher-dashboard.html">
                    🏠 Dashboard
                </a>

                <a
                    href="teacher-students.html"
                    class="active"
                >
                    👥 My Students
                </a>

                <a href="teacher-grades.html">
                    📊 Grades
                </a>

                <a href="teacher-conduct.html">
                    ⚠️ Conduct
                </a>

                <a href="teacher-assignments.html">
                    📝 Assignments
                </a>

                <a href="teacher-announcements.html">
                    📢 Announcements
                </a>

                <a href="teacher-timetable.html">
                    🗓️ Timetable
                </a>

                <a href="teacher-duty.html">
                    👨‍🏫 Teachers on Duty
                </a>

                <a href="teacher-profile.html">
                    👤 My Profile
                </a>

            </nav>


            <div class="sidebar-logout">

                <button
                    id="teacherLogoutButton"
                    class="logout-button"
                >
                    🚪 Logout
                </button>

            </div>

        </aside>


        <!-- ==============================
             MAIN CONTENT
        =============================== -->

        <main class="admin-dashboard-page">


            <div class="teacher-students-page">


                <!-- HEADER -->

                <section class="teacher-students-header">

                    <h1>
                        My Students
                    </h1>

                    <p>
                        View the students connected to your teaching subjects.
                    </p>

                </section>


                <!-- SEARCH -->

                <section class="student-search-box">

                    <input
                        type="text"
                        id="teacherStudentSearch"
                        placeholder="Search by student name or admission number..."
                    >

                </section>


                <!-- STUDENTS TABLE -->

                <section class="students-table-card">

                    <table class="students-table">

                        <thead>

                            <tr>

                                <th>
                                    Student
                                </th>

                                <th>
                                    Admission Number
                                </th>

                                <th>
                                    Class
                                </th>

                                <th>
                                    Email
                                </th>

                            </tr>

                        </thead>


                        <tbody id="teacherStudentsTableBody">

                            <tr>

                                <td
                                    colspan="4"
                                    class="empty-state"
                                >
                                    Loading students...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </section>


            </div>

        </main>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- MAIN JAVASCRIPT -->

    <script src="js/main.js"></script>


</body>

</html>
